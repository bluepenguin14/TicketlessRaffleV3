<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Ticketless Raffle
    </title>


    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<div class="container">


    <!-- Organization Header -->

    <header class="header">

        <div class="logo-placeholder">

            <img src="/images/raffle-banner.jpg">

        </div>


        <h1>
            Ticketless Raffle
        </h1>


        <h2>
            Supporting Our Veterans
        </h2>

    </header>




    <!-- Entry Form -->

    <section class="card">


        <h3>
	<br>
	<br>
            Enter the Raffle
        </h3>



        <form id="raffleForm">


            <label>
                Name
            </label>


            <input

                type="text"

                id="name"

                placeholder="Enter your name"

                required

            >




            <label>
                Email (optional)
            </label>


            <input

                type="email"

                id="email"

                placeholder="Enter your email"

            >




            <label for="packagePrice">Choose Your Ticket Package</label>
            <select id="packagePrice" required>
                <option value="1">$1 — 1 ticket</option>
                <option value="5">$5 — 6 tickets (Save $1)</option>
                <option value="10">$10 — 20 tickets (Save $10)</option>
            </select>
            <p class="package-note">Half of the recorded proceeds go to the winner; half support our veterans.</p>




            <button

                type="submit"

                class="enter-button"

            >

                ENTER RAFFLE

            </button>



        </form>



        <div id="message"></div>


    </section>





    <!-- Stats -->

    <section class="stats card">


        <h3>
            Current Raffle
        </h3>


        <p>
            Entrants:
            <span id="entrantCount">
                0
            </span>
        </p>


        <p>
            Total Entries:
            <span id="totalTickets">
                0
            </span>
        </p>


    </section>





    <footer>

        Thank you for supporting our veterans.

    </footer>



</div>



<script src="/js/app.js"></script>


</body>

</html>
